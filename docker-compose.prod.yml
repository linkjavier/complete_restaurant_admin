x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_HOST: redis
  REDIS_PORT: 6379
  FRONTEND_URL: ${FRONTEND_URL:-https://kutchen.online}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://kutchen.online}
  CORS_ALLOWED_HOST_SUFFIXES: ${CORS_ALLOWED_HOST_SUFFIXES:-kutchen.online}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://api.kutchen.xyz/auth/google/callback}
  FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
  FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
  FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL:-https://api.kutchen.xyz/auth/facebook/callback}
  FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
  FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  HERE_API_KEY: ${HERE_API_KEY:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  CLOUDFLARE_R2_ACCOUNT_ID: ${CLOUDFLARE_R2_ACCOUNT_ID:-}
  CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
  CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
  CLOUDFLARE_R2_BUCKET_NAME: ${CLOUDFLARE_R2_BUCKET_NAME:-}
  CLOUDFLARE_R2_PUBLIC_BASE_URL: ${CLOUDFLARE_R2_PUBLIC_BASE_URL:-}
  WHATSAPP_CLOUD_VERIFY_TOKEN: ${WHATSAPP_CLOUD_VERIFY_TOKEN:-}
  WHATSAPP_CLOUD_APP_SECRET: ${WHATSAPP_CLOUD_APP_SECRET:-}
  WHATSAPP_CLOUD_TOKEN_ENCRYPTION_KEY: ${WHATSAPP_CLOUD_TOKEN_ENCRYPTION_KEY:-}
  WHATSAPP_CLOUD_GRAPH_API_VERSION: ${WHATSAPP_CLOUD_GRAPH_API_VERSION:-v27.0}

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.prod
      target: runtime
    restart: unless-stopped
    environment: *api-environment
    expose:
      - "3000"
    volumes:
      - whatsapp_sessions:/app/packages/api/.wwebjs_auth
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.prod
      target: build
    command: ["npm", "run", "prisma:migrate", "--workspace=@blondie/api"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  whatsapp_sessions:
  caddy_data:
  caddy_config:

networks:
  backend:
